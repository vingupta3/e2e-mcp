name: ✨ Feature Request
description: Suggest an idea or new E2E service tool for e2e-mcp
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem or missing service?
      description: A clear and concise description of the use-case or limitation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution / New Tool You'd Like
      description: What tool name, parameters, or behavior would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
