name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build, Test & Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set package.json version from release tag
        # On a tag-based release (GITHUB_REF like refs/tags/v1.2.3), set the version to the
        # tag without the leading 'v'. Skipped for manual workflow_dispatch runs.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Setting package.json version to ${TAG#v}"
            npm version --no-git-tag-version "${TAG#v}"
          else
            echo "Not a tag build (GITHUB_REF=${GITHUB_REF}); skipping version update."
          fi

      - name: Build TypeScript
        run: npm run build

      - name: Run verification test suite
        run: npm test

      - name: Publish package to NPM with Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
